commitMessagePrompt: |
  Generate a commit message for this VS Code extension following the Conventional Commits specification.

  Format: <type>(<scope>): <subject>

  If the branch name contains a JIRA ticket ID (e.g., WEBAPP-123, TEST-456), prefix the commit message with (TICKET-ID].
  Example: feat(ui): add commit generation button (WEBAPP-123)

  Types:
  - feat: A new feature
  - fix: A bug fix
  - docs: Documentation only changes
  - style: Code style changes (formatting, missing semi colons, etc)
  - refactor: Code change that neither fixes a bug nor adds a feature
  - perf: Performance improvement
  - test: Adding or updating tests
  - chore: Changes to build process or auxiliary tools
  - ci: CI/CD changes

  Scopes: extension, config, ai, git, ui, docs

  Rules:
  - Use imperative mood ("add" not "added")
  - Don't capitalize first letter
  - No period at the end
  - Keep under 50 characters
  - Be specific and concise
  - Extract JIRA ticket ID from branch name if present (pattern: [A-Z]+-[0-9]+)

  Context:
  Branch: {{branch}}
  Author: {{author}}

  Changes:
  {{changes}}
